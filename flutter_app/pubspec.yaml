publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_svg: ^2.0.10+1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  cached_network_image: ^3.3.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

